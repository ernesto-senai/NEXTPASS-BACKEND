# API no Render, plano grátis. No painel do Render: New > Blueprint, escolha este
# repositório e preencha as variáveis pedidas (o passo a passo está no README).
services:
  - type: web
    name: nextpass-api
    runtime: docker
    plan: free
    # Mesma região do banco no Supabase (East US), para as consultas serem rápidas.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
